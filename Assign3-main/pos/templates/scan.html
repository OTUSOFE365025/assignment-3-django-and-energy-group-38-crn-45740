<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Cash Register - Scan</title>
<style>
    body 
    { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; 
     }
     .row { display: flex; gap: 0,75rem; align-items: center; }
     input[type=text]{padding:.rem; width: 280px; }
     button{ padding:.55rem .9rem; cursor:pointer;}
     .card  { border:1px solid #ddd; padding:1rem; border-radius:10px; max-width:460px; margin:1rem; }
     .price { font-size:1.25rem; font-weight:600: }
     .not found{ color:#b00; margin-top:.75rem; }
    </style>
    <body>
        <h1>Scan Product</h1>
        <form method="post" class="row">
            {% csrf_token %}
            {{ form.upc }}
            <button type="submit">Scan</button>
        </form>

        {% if msg %}
        <p class="not found">{{ msg}} </p>
        {% endif %}
        
        {% if product %}
        <div class="card">
            <div><strong>UPC:</strong> {{ product.upc }}</div>
            <div><strong>Name:</strong> {{ product.name }} </div>
            <div class="price"><strong>Price:</strong> ${{ product.price}}</div>
        </div>
        {% endif %}
    </body>
    </html>
